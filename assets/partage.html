<title>Image de partage — Encrine</title>
<!-- La source de assets/partage.png, l'image des aperçus de lien (Open

<link rel="stylesheet" href="../styles.css">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--craie); }
  .vignette { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 58px 0 0 80px; color: var(--ardoise); }
  .vignette__logo { display: block; height: 96px; width: auto; margin-left: -12px; }
  .vignette h1 { font: 800 74px/1.08 var(--font-titre); letter-spacing: -0.02em; margin: 40px 0 0; }
  .vignette__pied { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--ardoise); color: var(--craie);
    display: flex; align-items: center; padding: 0 80px; font: 600 30px var(--font-texte); letter-spacing: .01em; }
  .vignette__pied span { opacity: .78; font-weight: 400; margin-left: 18px; }
  .vignette__marelle { position: absolute; right: 96px; top: 14px; width: 250px; transform: rotate(4deg); }
  .vignette__marelle svg { display: block; width: 100%; height: auto; overflow: visible; }
</style>
</head>
