name: Page d'accueil
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Le site, sans ce qui ne sert qu'au dépôt : les outils de relecture,
      # les skills, les formulaires d'issue et les consignes (AGENTS.md,
      # CLAUDE.md, README.md). Seuls les fichiers versionnés partent.
      - name: Assembler le site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/outils _site/.agents _site/.claude _site/.github _site/AGENTS.md _site/CLAUDE.md _site/README.md
          test -f _site/index.html && test -f _site/CNAME && test ! -e _site/outils && test ! -e _site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
